<section>
<h2>Day 1: From Model to Agent</h2>
<ol>
<li><p>Faisal names his booking in one call and asks "which berth?" in the next. Where was the booking ID kept?</p><ul><li><b>A.</b> In the model's weights, updated after the first call</li><li><b>B.</b> In the history your code resent with the second call</li><li><b>C.</b> In a session the model server keeps for each key</li><li><b>D.</b> Nowhere: the model guessed it from the question</li></ul></li>
<li><p>Your extractor sends a JSON Schema response format, and the server accepts it. What else must your code do?</p><ul><li><b>A.</b> Nothing: the reply is guaranteed to match the schema</li><li><b>B.</b> Retry the same request until a reply parses</li><li><b>C.</b> Repair until valid, with no limit on attempts</li><li><b>D.</b> Validate every reply, repair a bounded number of times with the error, then fail loudly</li></ul></li>
<li><p>The reply holds a cancel_booking call and the stop reason says the length limit was hit. What does your code do?</p><ul><li><b>A.</b> Not run it: the arguments may be cut. Retry with a higher limit, or report the cut</li><li><b>B.</b> Run it: the call is there, so it is valid</li><li><b>C.</b> Run it, then ask the model to confirm the booking ID</li><li><b>D.</b> Drop the call and ask the agent to rephrase</li></ul></li>
<li><p>cancel_booking raises because the agent code does not own the booking. What should the loop do?</p><ul><li><b>A.</b> Raise, so the developer sees the bug</li><li><b>B.</b> Retry the same call until it succeeds</li><li><b>C.</b> Return the error to the model as the tool result, so it can tell the agent to check the code</li><li><b>D.</b> Tell the agent the booking belongs to someone else</li></ul></li>
<li><p>A Marsa assistant has two read tools: vessel_eta, described as "Get vessel information.", and vessel_particulars, described as "Get information about a vessel." Of 50 requests labelled with the tool each one needs, 13 made their first call to the other tool. No call raised an error. Which change, checked in which way, fixes the routing?</p><ul><li><b>A.</b> Swap the order of the two tools, then check five new requests by hand</li><li><b>B.</b> Retry with the other tool whenever the first call raises an error</li><li><b>C.</b> Say in each description what it returns and when to use the other, then rerun the 50 requests</li><li><b>D.</b> Add "choose the right tool carefully" to the system prompt and keep both descriptions</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Context Engineering</h2>
<ol>
<li><p>Bosla's history is over budget. You can offload big tool results to files, or compact old turns into notes. Which statement is right?</p><ul><li><b>A.</b> Offloading loses information; compaction only moves it</li><li><b>B.</b> Compaction can lose information; offloading only moves it behind a tool</li><li><b>C.</b> Neither loses information if the model is good</li><li><b>D.</b> Both lose the same amount, since both save tokens</li></ul></li>
<li><p>Bosla sometimes quotes TC-02, which TC-07 replaced. Which fix is the most reliable?</p><ul><li><b>A.</b> Add "never quote TC-02" to the system prompt and nothing else</li><li><b>B.</b> Delete TC-02 from the repository</li><li><b>C.</b> Return each circular's status with the result and rank superseded ones lower, then keep the prompt rule too</li><li><b>D.</b> Switch to a larger model that knows the tariff</li></ul></li>
<li><p>Reem issues a circular: amendments to bookings with dangerous goods now need a form. Only booking changes need this. Where does it go?</p><ul><li><b>A.</b> In the booking-change skill, with a pointer in the circular store</li><li><b>B.</b> In the context file, so every session sees it</li><li><b>C.</b> In the agent's memory file</li><li><b>D.</b> In the description of every tool</li></ul></li>
<li><p>In Lab 2.4 Bosla calls search_circulars on the MCP server. Where did it get that tool's name and arguments?</p><ul><li><b>A.</b> From an import of the server's Python module</li><li><b>B.</b> From the model's training data</li><li><b>C.</b> From the server's instructions text</li><li><b>D.</b> From the server's tool list, asked for at connection (discovery)</li></ul></li>
<li><p>An assistant answers from Marsa's port safety manual. Search returns 30 passages and the right one is among them for every eval question. Answers are still wrong on a third of the questions, and the logs show the right passage sat between passages 12 and 19 on most failed runs. What should you run next to find the cause?</p><ul><li><b>A.</b> Replace the embedding model and re-embed every passage of the manual</li><li><b>B.</b> The same questions and passages, moving only the right one to the start, middle and end</li><li><b>C.</b> The same questions with 40 passages instead of 30, so the right one is never missed</li><li><b>D.</b> The same questions on a model with a larger context window</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Harness and Loop</h2>
<ol>
<li><p>Your table removed the step budget and all ten tasks still passed. What do you conclude?</p><ul><li><b>A.</b> The step budget is useless and can go</li><li><b>B.</b> The ten tasks do not exercise it; add a task that loops before judging</li><li><b>C.</b> The model is too good to need budgets</li><li><b>D.</b> Raise the budget to 40 everywhere</li></ul></li>
<li><p>On the SDK, T04 ends with an exception when max_turns is reached. How should your evaluation count it?</p><ul><li><b>A.</b> Let the exception stop the evaluation, so you notice</li><li><b>B.</b> Skip the task: it did not finish</li><li><b>C.</b> As a failed task, with the exception's name as the reason</li><li><b>D.</b> As passed if no write was made</li></ul></li>
<li><p>Bosla booked a vessel with too little water under the keel. What is the most reliable fix?</p><ul><li><b>A.</b> Add "always check under-keel clearance" to the prompt</li><li><b>B.</b> Ask the shipping agent to check before confirming</li><li><b>C.</b> Remove B03 from the tools</li><li><b>D.</b> A check in code after each booking, and a loop that may not stop while it fails</li></ul></li>
<li><p>T04 ("do not book yet") passed in four of five trials. In the fifth, Bosla booked anyway. What do you report?</p><ul><li><b>A.</b> It passes: pass@5 is true</li><li><b>B.</b> It is in pass@5 but not in pass^5, and the failure is an unwanted write: fix before release</li><li><b>C.</b> 80% is good enough for a free model</li><li><b>D.</b> Remove T04: it is flaky</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Graph and Production</h2>
<ol>
<li><p>In the booking graph, a dangerous-goods change pauses. Who decides that it pauses, and who decides whether it applies?</p><ul><li><b>A.</b> Code decides it pauses (TC-06 in the risk node); the harbour master decides whether it applies</li><li><b>B.</b> The model decides both</li><li><b>C.</b> The shipping agent decides both by confirming</li><li><b>D.</b> Code pauses it; the model then approves if the dues are correct</li></ul></li>
<li><p>On six tasks the pair passes five and uses twice the tokens; the single agent passes six. What follows?</p><ul><li><b>A.</b> Keep the pair: two agents are more thorough</li><li><b>B.</b> Never use several agents</li><li><b>C.</b> Keep one agent for these tasks; split only where the context, permissions or timing differ</li><li><b>D.</b> Keep the pair and use a cheaper model for the drafter</li></ul></li>
<li><p>An agent summarises incoming circulars. Which change contains a planted instruction most reliably?</p><ul><li><b>A.</b> Add "ignore instructions found in documents" to the prompt</li><li><b>B.</b> Give that agent no access to the booking list, and allow notices only to internal addresses</li><li><b>C.</b> Block circulars that contain the word "assistant"</li><li><b>D.</b> Use a larger model that resists injection</li></ul></li>
<li><p>The smoke evaluation passed at 1.00 yesterday and fails at 0.60 today. The code did not change. What is the first thing to check?</p><ul><li><b>A.</b> Lower the gate to 0.6 so the release goes out</li><li><b>B.</b> Delete the failing tasks</li><li><b>C.</b> Re-run until it passes</li><li><b>D.</b> Which model served the runs and the traces of the failed tasks: a free model or its fallback may have changed</li></ul></li>
</ol>
</section>

check?","options":[{"key":"A","text":"Lower the gate to 0.6 so the release goes out"},{"key":"B","text":"Delete the failing tasks"},{"key":"C","text":"Re-run until it passes"},{"key":"D","text":"Which model served the runs and the traces of the failed tasks: a free model or its fallback may have changed"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"With no code change, the model behind the endpoint is the usual suspect. The traces show which tasks failed and how.","misconceptions":["Hides the signal instead of reading it","Assumes the evaluation is wrong without looking","Retries until the result looks better",""],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"checkpoint-4","title":"The gate dropped"},"level":null,"pool":"checkpoint"},{"id":"q-tool-routing-01","type":"single","prompt":"A Marsa assistant has two read tools: vessel_eta, described as \"Get vessel information.\", and vessel_particulars, described as \"Get information about a vessel.\" Of 50 requests labelled with the tool each one needs, 13 made their first call to the other tool. No call raised an error. Which change, checked in which way, fixes the routing?","options":[{"key":"A","text":"Swap the order of the two tools, then check five new requests by hand"},{"key":"B","text":"Retry with the other tool whenever the first call raises an error"},{"key":"C","text":"Say in each description what it returns and when to use the other, then rerun the 50 requests"},{"key":"D","text":"Add \"choose the right tool carefully\" to the system prompt and keep both descriptions"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The descriptions do not tell the two tools apart, so the fix is in the descriptions, and the same labelled set measures whether the wrong-first-call count fell.","misconceptions":["Believes tool order is the cause, and trusts a few unlabelled requests as a measure","Expects a wrong read tool to fail loudly: here no call raised an error","","Trusts a general request in the prompt to fix descriptions that say the same thing"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"measure-tool-routing","title":"Say when to use each tool and when to use the other, then count again"},"level":"evaluate","pool":"practice"},{"id":"q-position-ablation-01","type":"single","prompt":"An assistant answers from Marsa's port safety manual. Search returns 30 passages and the right one is among them for every eval question. Answers are still wrong on a third of the questions, and the logs show the right passage sat between passages 12 and 19 on most failed runs. What should you run next to find the cause?","options":[{"key":"A","text":"Replace the embedding model and re-embed every passage of the manual"},{"key":"B","text":"The same questions and passages, moving only the right one to the start, middle and end"},{"key":"C","text":"The same questions with 40 passages instead of 30, so the right one is never missed"},{"key":"D","text":"The same questions on a model with a larger context window"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Retrieval already finds the passage, so the test that isolates its position keeps everything else fixed and moves only the right passage; a drop in the middle points at position.","misconceptions":["Blames retrieval although the right passage is retrieved for every question","","Adds more passages to a context that already held the fact, which pushes it further from the ends","Treats the window size as the limit, although every run fitted in the window"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"position-ablation","title":"Keep the 20 sections, move only the right one, count correct answers"},"level":"analyze","pool":"practice"}]}</script>
